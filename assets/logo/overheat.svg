<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Overheat: a faceted flame on a transparent background. Flat facets only, no
       gradients or glow; light comes from the upper left, so left-facing planes use the
       lighter tones and right-facing planes the darker ones. The PNGs at 16 and 24 px are
       rendered from overheat-small.svg (same outline, fewer facets). See render.sh. -->
  <g transform="translate(4 1)" stroke-width="1.5" stroke-linejoin="round">
    <!-- back tongue, in shadow behind the front one -->
    <polygon fill="#d42414" stroke="#d42414" points="148,138 110,300 150,296"/>
    <polygon fill="#a8190d" stroke="#a8190d" points="148,138 150,296 200,236"/>
    <polygon fill="#ff2d1a" stroke="#ff2d1a" points="110,300 176,410 150,296"/>
    <polygon fill="#d42414" stroke="#d42414" points="150,296 176,410 168,268 200,236"/>
    <!-- front tongue: lit upper-left planes, shaded right and lower planes -->
    <polygon fill="#ffb13d" stroke="#ffb13d" points="300,36 218,150 276,270"/>
    <polygon fill="#ff8a00" stroke="#ff8a00" points="218,150 168,268 276,270"/>
    <polygon fill="#ff6a00" stroke="#ff6a00" points="300,36 276,270 354,150"/>
    <polygon fill="#ff2d1a" stroke="#ff2d1a" points="354,150 276,270 394,276"/>
    <polygon fill="#ff6a00" stroke="#ff6a00" points="168,268 176,410 264,400 276,270"/>
    <polygon fill="#d42414" stroke="#d42414" points="276,270 264,400 364,398 394,276"/>
    <polygon fill="#ff2d1a" stroke="#ff2d1a" points="176,410 262,474 264,400"/>
    <polygon fill="#a8190d" stroke="#a8190d" points="264,400 262,474 364,398"/>
    <!-- core gem -->
    <polygon fill="#fff3c4" stroke="#fff3c4" points="277,218 224,338 268,348"/>
    <polygon fill="#ffd54a" stroke="#ffd54a" points="277,218 268,348 316,330"/>
    <polygon fill="#ffe27a" stroke="#ffe27a" points="224,338 262,436 268,348"/>
    <polygon fill="#ffb13d" stroke="#ffb13d" points="268,348 262,436 316,330"/>
  </g>
</svg>
